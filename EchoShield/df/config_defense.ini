# ============================================================
# config_defense.ini
# DeepFilterNet Defence Upgrade – Training Configuration
# ============================================================
# Copy this file alongside config.ini (or pass as --cfg path)
# and set [train] model = deepfilternet_defense
# ============================================================

# ------------------------------------------------------------
# [train] – core training settings
# ------------------------------------------------------------
[train]
model           = deepfilternet_defense
batch_size      = 16
batch_size_eval = 8
num_workers     = 4
max_epochs      = 50
seed            = 1337

# Optimizer: AdamW with cosine annealing warm restart
optimizer       = adamw
lr              = 0.0005
lr_min          = 0.00001
weight_decay    = 0.01

# Learning-rate scheduler
lrs_scheduler   = cosine_annealing
warmup_steps    = 2000

# Gradient clipping
clip_grad_norm  = 1.0

# Mixed precision
use_amp         = true

# Snapshot / checkpoint
checkpoint_every = 5
keep_last_k      = 3

# Early stopping (patience in epochs, monitored metric = composite loss)
early_stopping_patience = 10

# Dataset (generated by generate_defense_dataset.py)
# train_dir and valid_dir are subdirectories with noisy/ clean/ split
# Adjust to your actual dataset paths before launching training.
train_dir = data/defense_dataset/train
valid_dir = data/defense_dataset/valid


# ------------------------------------------------------------
# [deepfilternet] – architecture flags for DefenseDfNet
# ------------------------------------------------------------
[deepfilternet]
# ── Defence-specific modules ──────────────────────────────
enable_noise_classifier = true
enable_impulse_limiter  = true
enable_adaptive_dsp     = true

# Adaptive DSP filter order (K taps per frequency bin)
adaptive_dsp_order = 2
# Base NLMS step size (modulated by AI noise-class probabilities)
adaptive_dsp_mu    = 0.15

# Impulse limiter thresholds
# crest_thresh_db: crest factor above which a frame is flagged as impulsive
crest_thresh_db    = 12.0
# energy_thresh_rel: relative energy surge multiplier
energy_thresh_rel  = 8.0
# max_atten_db: maximum attenuation applied to a shock frame
max_atten_db       = 24.0

# ── Core DFN3 backbone (unchanged from upstream) ──────────
# Number of ERB bands for the low-frequency mask branch
erb_fb_bins        = 32
# Deep-filtering frequency bins
df_bins            = 96
# Deep-filtering filter order
df_order           = 5
# Lookahead (0 for causal / real-time operation)
lookahead          = 0

# Hidden sizes (match pretrained DFN3 so weights transfer cleanly)
enc_hidden         = 256
erb_hidden         = 64
df_hidden          = 128
df_gru_groups      = 2
# GRU bias
gru_groups         = 2


# ------------------------------------------------------------
# [loss] – DefenseEnhancedLoss weighting factors
# ------------------------------------------------------------
[loss]
# Multi-resolution spectral loss weight
lambda_spec    = 1.0

# Mask loss weight (ERB mask + DF coefficient quality)
lambda_mask    = 1.0

# Noise class cross-entropy weight
# Low weight so classifier doesn't dominate early training
lambda_cls     = 0.10

# Impulse penalty weight (heavily penalise residual shock leakage)
lambda_impulse = 2.0

# SI-SDR regularisation (optional; set to 0 to disable)
lambda_sisdr   = 0.5

# Class weights for noise-class loss (inverse frequency if imbalanced)
# Order: [stationary, non-stationary, impulsive]
class_weights  = 1.0 1.0 1.5


# ------------------------------------------------------------
# [audio] – audio front-end (must match libDF compile params)
# ------------------------------------------------------------
[audio]
sr              = 48000
frame_size      = 480
fft_size        = 960
nb_erb          = 32
nb_df           = 96
min_nb_erb_freqs = 2


# ------------------------------------------------------------
# [augmentation] – training-time data augmentation
# ------------------------------------------------------------
[augmentation]
# Dynamic SNR range during training
snr_low  = -10
snr_high =  10

# Random amplitude scaling per clip
gain_range_db = 6.0

# Room impulse response convolution probability (simulates indoor reverb)
rir_probability = 0.3

# Channel dropout probability (simulates single-mic degradation)
channel_dropout = 0.1
